<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>手トラッキング</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
video,canvas{position:fixed;left:0;top:0;width:100%;height:100%}
video{object-fit:cover}
#hud{position:fixed;left:calc(8px + env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px));font:12px/1.5 ui-monospace,Menlo,monospace;background:rgba(0,0,0,.55);padding:6px 8px;border-radius:8px;white-space:pre;pointer-events:none}
#ctl{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.6);display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
select,button{font:inherit;font-size:14px;background:#222;color:#fff;border:1px solid #666;border-radius:8px;padding:6px 10px}
button.go{background:#ff4fa3;border:0;font-weight:bold}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#0a0b18;text-align:center;padding:20px;z-index:3}
#start p{max-width:420px;font-size:13px;color:#aab;margin:0}
#err{color:#ff8a8a;font-size:13px;max-width:420px}
</style></head><body>
<video id="v" playsinline muted autoplay></video>
<canvas id="c"></canvas>
<div id="hud">起動前</div>
<div id="ctl">
 判定点<select id="pt"><option value="tip">指先</option><option value="pip">第二関節</option><option value="mcp">指の付け根</option><option value="palm">手のひら中心</option></select>
 解像度<select id="res"><option value="480">640x480</option><option value="720">1280x720</option></select>
 <label><input type="checkbox" id="skel" checked>骨格</label>
 <label><input type="checkbox" id="vid" checked>映像</label>
</div>
<div id="start">
 <h2 style="margin:0">手トラッキング検証</h2>
 <p>背面カメラで両手を検出し、FPS・推論時間・遅延を表示します。骨格が実際の手より遅れて見えるほど遅延が大きいです。手を速く振って確認してください。</p>
 <select id="dl"><option value="GPU">GPU</option><option value="CPU">CPU</option></select>
 <button class="go" id="go">カメラ開始</button>
 <div id="err"></div>
</div>
<script type="module">
import {HandLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const $=id=>document.getElementById(id),v=$('v'),cv=$('c'),g=cv.getContext('2d');
const WASM="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL="https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const FINGERS=[[4,3,2],[8,7,6,5],[12,11,10,9],[16,15,14,13],[20,19,18,17]]; /* [tip,...] */
const BONES=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
let hl=null,res=null,resT=0,W=0,H=0,mapS=1,mapX=0,mapY=0;
const st={fps:0,inf:0,infAvg:0,det:0,cap:null,frames:0,t0:performance.now(),lastVt:-1};

function resize(){W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);fit()}
function fit(){ /* object-fit:cover と同じ写像 */
 const vw=v.videoWidth||W,vh=v.videoHeight||H;mapS=Math.max(W/vw,H/vh);mapX=(W-vw*mapS)/2;mapY=(H-vh*mapS)/2;
}
const X=(p)=>mapX+p.x*(v.videoWidth||W)*mapS, Y=(p)=>mapY+p.y*(v.videoHeight||H)*mapS;
addEventListener('resize',resize);resize();

/* 判定点: 指ごとに1点(5個) + 手のひら中心の場合は1点 */
function judgePts(lm,mode){
 if(mode==='palm'){const ids=[0,5,9,13,17];return[{x:ids.reduce((s,i)=>s+lm[i].x,0)/5,y:ids.reduce((s,i)=>s+lm[i].y,0)/5}]}
 const idx={tip:[4,8,12,16,20],pip:[3,6,10,14,18],mcp:[2,5,9,13,17]}[mode];
 return idx.map(i=>lm[i]);
}

async function start(){
 $('err').textContent='';
 try{
  $('go').disabled=true;$('go').textContent='準備中…';
  const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:$('res').value==='720'?1280:640},height:{ideal:+$('res').value},frameRate:{ideal:60}}});
  v.srcObject=stream;await v.play();
  const trk=stream.getVideoTracks()[0],s=trk.getSettings();
  st.cam=`${s.width}x${s.height}@${Math.round(s.frameRate||0)}`;
  fit();
  const fs=await FilesetResolver.forVisionTasks(WASM);
  hl=await HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:MODEL,delegate:$('dl').value},runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:.5,minHandPresenceConfidence:.5,minTrackingConfidence:.5});
  $('start').style.display='none';
  loop();
 }catch(e){$('err').textContent='失敗: '+(e.message||e);$('go').disabled=false;$('go').textContent='カメラ開始'}
}
$('go').onclick=start;
$('res').onchange=()=>{if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());start()}};

function onFrame(now,meta){
 if(!hl||v.readyState<2)return;
 if(meta&&meta.captureTime!==undefined)st.cap=meta.captureTime; /* 取得できる環境のみ */
 const a=performance.now();
 let r;try{r=hl.detectForVideo(v,a)}catch(e){return}
 const b=performance.now();
 st.inf=b-a;st.infAvg=st.infAvg?st.infAvg*.9+st.inf*.1:st.inf;
 st.frames++;res=r;resT=b;
 if(st.cap!==null&&meta.captureTime!==undefined)st.capLag=b-meta.captureTime;
 else if(meta&&meta.presentationTime!==undefined)st.capLag=b-meta.presentationTime;
}
function loop(){
 const nx=()=>v.requestVideoFrameCallback?v.requestVideoFrameCallback((n,m)=>{onFrame(n,m);render();nx()}):requestAnimationFrame(()=>{onFrame(performance.now());render();nx()});
 nx();
}
function render(){
 const t=performance.now();
 if(t-st.t0>=1000){st.fps=st.frames*1000/(t-st.t0);st.frames=0;st.t0=t}
 g.clearRect(0,0,W,H);
 v.style.visibility=$('vid').checked?'visible':'hidden';
 if(!res)return;
 const mode=$('pt').value,cols=['#ff4fa3','#4fc3ff'];
 res.landmarks.forEach((lm,hi)=>{
  const c=cols[hi%2];
  if($('skel').checked){
   g.strokeStyle=c;g.lineWidth=2;g.beginPath();
   for(const[a,b]of BONES){g.moveTo(X(lm[a]),Y(lm[a]));g.lineTo(X(lm[b]),Y(lm[b]))}
   g.stroke();
   g.fillStyle='#fff';for(const p of lm){g.beginPath();g.arc(X(p),Y(p),2.5,0,7);g.fill()}
  }
  g.fillStyle='#ffd84a';g.strokeStyle='#000';g.lineWidth=2;
  for(const p of judgePts(lm,mode)){g.beginPath();g.arc(X(p),Y(p),9,0,7);g.fill();g.stroke()}
 });
 const hands=res.landmarks.length;
 $('hud').textContent=
`FPS(検出)  ${st.fps.toFixed(1)}
推論時間   ${st.infAvg.toFixed(1)} ms (今回 ${st.inf.toFixed(1)})
撮影→結果  ${st.capLag!==undefined?st.capLag.toFixed(0)+' ms':'取得不可'}
カメラ     ${st.cam||'-'}
検出した手 ${hands}
目安: 推論+撮影→結果の合計が約100ms以内なら有望`;
}
</script></body></html>
