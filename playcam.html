<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Play (Camera)</title>
<style>
:root{--ac:#ff4fa3}
html,body{margin:0;height:100%;overflow:hidden;background:#0a0b18;color:#dfe2ff;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
video{position:fixed;left:0;top:0;width:100%;height:100%;object-fit:cover;background:#000}

.ov{position:fixed;left:0;top:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;background:rgba(5,6,16,.9);z-index:5}
.ov.on{display:flex}
.panel{width:min(92vw,460px);max-height:94vh;overflow:auto;touch-action:pan-y;background:#171a35;border-radius:16px;padding:16px;text-align:center;box-sizing:border-box}
.panel h2{margin:6px 0 2px;font-size:20px}
.panel .sub{color:#8f96c8;font-size:13px}
.jk{width:120px;height:120px;border-radius:12px;object-fit:cover;background:linear-gradient(135deg,#ff4fa3,#4f7bff)}
.dtag{display:inline-block;margin:6px 0;padding:2px 12px;border-radius:99px;font-weight:bold;font-size:13px;color:#fff}
.set{text-align:left;font-size:13px;margin:10px 0}
.set label{display:block;margin:8px 0 2px}
.set input[type=range]{width:100%;accent-color:var(--ac)}
.set small{color:#8f96c8}
.set select{background:#0f1126;color:#dfe2ff;border:1px solid #3a3f78;border-radius:6px;padding:4px 6px;font-size:13px;margin-left:6px}
button,.btn{display:block;width:100%;box-sizing:border-box;border:0;border-radius:12px;padding:13px;margin:8px 0 0;font:inherit;font-weight:bold;font-size:16px;background:var(--ac);color:#fff;text-align:center;text-decoration:none;cursor:pointer}
button.alt,.btn.alt{background:#4f7bff}
button.sub2,.btn.sub2{background:transparent;border:1px solid #8886;color:#dfe2ff}
button:disabled{opacity:.5}
#pbtn{position:fixed;left:calc(8px + env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px));z-index:4;width:44px;height:44px;padding:0;margin:0;border-radius:50%;background:rgba(255,255,255,.14);font-size:18px;display:none}
.rank{font-size:44px;font-weight:900;letter-spacing:1px;background:linear-gradient(180deg,#ffe98a,#ff9a2e);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.ach{font-size:28px;font-weight:bold}
table{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0}
td,th{padding:4px 2px;text-align:center}
th{font-weight:bold}
td:first-child{text-align:left;color:#8f96c8}
.fc{color:#ffd84a;font-weight:bold;min-height:1.2em}
</style></head><body>
<script src="outprofile.js"></script>
<video id="v" playsinline muted autoplay></video>
<canvas id="c"></canvas>
<button id="pbtn" class="ui" aria-label="pause">❚❚</button>

<div id="ready" class="ov on ui"><div class="panel">
 <img id="jk" class="jk" alt="">
 <h2 id="rt">読み込み中…</h2><div class="sub" id="ra"></div>
 <div class="dtag" id="rd" style="display:none"></div>
 <div class="set">
  <label>Hi-Speed <b id="hsv">6.00</b><input id="hs" type="range" min="2" max="10" step="0.25" value="6"></label>
  <label>出力 <select id="om"><option value="auto">自動判定</option><option value="wired">有線・スピーカー</option><option value="bt">Bluetooth</option></select></label>
  <small id="od"></small>
  <label>音源補正 <b id="auv">0</b> ms<input id="au" type="range" min="0" max="500" step="5" value="0"></label>
  <small>音がノーツより遅れるとき（Bluetoothなど）→ 上げると音が早く鳴る</small>
  <label>入力補正 <b id="ofv">0</b> ms<input id="of" type="range" min="-250" max="100" step="1" value="-60"></label>
  <small>LATEが多い→マイナス側 / FASTが多い→プラス側</small>
  <label><input id="snd" type="checkbox" checked> ヒット音</label>
  <label><input id="fl" type="checkbox" checked> FAST / LATE 表示</label>
  <label>判定点 <select id="pt"><option value="tip">指先</option><option value="pip" selected>第二関節</option><option value="mcp">指の付け根</option><option value="palm">手のひら中心</option></select></label>
  <label>動き判定しきい値 <b id="mvv">3</b> %<input id="mv" type="range" min="0" max="12" step="0.5" value="3"></label>
  <small>譜面半径に対するこの割合以上、直近0.12秒で動いた点だけがタップ/タッチの判定に使われます（0で無効）。ホールドとスライドは対象外</small>
  <label>映像の暗さ <b id="dmv">35</b> %<input id="dm" type="range" min="0" max="85" step="5" value="35"></label>
  <label><input id="skl" type="checkbox" checked> 骨格表示</label>
 </div>
 <div class="sub" id="rs"></div>
 <div class="sub" id="cs"></div>
 <button class="alt" id="cb" style="display:none">カメラを開始（再試行）</button>
 <button id="go" disabled>読み込み中…</button>
 <a class="btn sub2" href="index.html">← メニューに戻る</a>
</div></div>

<div id="pause" class="ov ui"><div class="panel">
 <h2>PAUSE</h2>
 <button id="pr">再開</button><button id="pt" class="alt">最初から</button><a class="btn sub2" href="index.html">メニューへ</a>
</div></div>

<div id="result" class="ov ui"><div class="panel">
 <div class="sub" id="xt"></div>
 <div class="rank" id="xr"></div>
 <div class="ach" id="xa"></div>
 <div class="fc" id="xf"></div>
 <table id="xtab"></table>
 <div class="sub" id="xm"></div>
 <button id="xre">もう一度</button><a class="btn sub2" href="index.html">メニューへ</a>
</div></div>
<script>
/* 診断: JSエラーを準備画面に表示する */
(()=>{const sh=m=>{const e=document.getElementById('rs');if(e){e.style.color='#ff8a8a';e.textContent=m}};
addEventListener('error',e=>sh('JSエラー: '+e.message+' (行'+e.lineno+')'));
addEventListener('unhandledrejection',e=>sh('未処理エラー: '+(e.reason&&e.reason.message||e.reason)));})();
const dbgRs=m=>{const e=document.getElementById('rs');if(e){e.style.color='';e.textContent=m}};
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d'),TAU=Math.PI*2;
let S=600,cx,cy,R,notes=[],endT=0,now=-2,playing=true,last=0;
let hs=6,A=2.25/(.6*hs),speed=1,mirror='none',judge='simple',exHi=false,sndOn=false,sndOff=0,showHud=true;
const ang=k=>-Math.PI/2+(k-.5)*Math.PI/4,P=(k,r=1)=>[Math.cos(ang(k))*r,Math.sin(ang(k))*r];
const wrap=k=>((k-1)%8+8)%8+1,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const COL={tap:'#ff69b4',each:'#FFD700',brk:'#FF8C00',star:'#00CED1',starEach:'#FFE44D',touch:'#00BFFF'};

/* ================= 譜面パーサ ================= */
function durOf(s,bpm){let b=s.replace(/[\[\]]/g,'');if(b.includes('##'))b=b.split('##')[1];if(b[0]==='#')return +b.slice(1);const h=b.indexOf('#');if(h>0){bpm=+b.slice(0,h);b=b.slice(h+1)}if(!b.includes(':'))return +b||240/bpm;const q=b.split(':');return 240/bpm/q[0]*q[1]}
/* ===== スライド形状: 参考元 SlideCalculator.T と同じ式(半径1の単位円で計算し、折れ線にサンプリング) ===== */
function arcPts(cx,cy,r,a0,sw){const N=Math.max(8,Math.ceil(Math.abs(sw)/(Math.PI/48))),o=[];for(let i=0;i<=N;i++){const t=a0+sw*i/N;o.push([cx+Math.cos(t)*r,cy+Math.sin(t)*r])}return o}
const SW_P=[-1.25,-1,-.75,-.5,-.25,-2,-1.75,-1.5],SW_Q=[1.25,1.5,1.75,2,.25,.5,.75,1],
 SW_PP=[-1.25,-1.125,-.75,-2.25,-2,-1.875,-1.625,-1.5],SW_QQ=[1.25,1.5,1.625,1.875,2,2.25,.75,1.125];
function seg(sh,s,tg,via){
 const a=P(s),b=P(tg),T2=Math.PI*2,df=((tg-s)%8+8)%8;
 if(sh==='-'||sh==='w')return[a,b];
 if(sh==='v')return df===4?[a,b]:[a,[0,0],b];
 if(sh==='V')return[a,P(via),b];
 if(sh==='^'){let f=ang(tg)-ang(s);while(f>Math.PI)f-=T2;while(f<-Math.PI)f+=T2;return arcPts(0,0,1,ang(s),f)}
 if(sh==='<'||sh==='>'){
  let h=ang(tg)-ang(s);while(h>Math.PI)h-=T2;while(h<-Math.PI)h+=T2;
  const top=s===1||s===2||s===7||s===8;
  if(sh==='>'){if(top){if(h<=0)h+=T2}else{if(h>=0)h-=T2}}else{if(top){if(h>=0)h-=T2}else{if(h<=0)h+=T2}}
  return arcPts(0,0,1,ang(s),h);
 }
 if(sh==='s'||sh==='z'){
  const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy,py=ux,D=.4;
  const A=[a[0]+ux*L*.49+px*D,a[1]+uy*L*.49+py*D],B=[a[0]+ux*L*.51-px*D,a[1]+uy*L*.51-py*D];
  return sh==='s'?[a,A,B,b]:[a,B,A,b];
 }
 if(sh==='pp'||sh==='qq'){
  const r=P((s-1+4)%8+1),o=[a[0]+.4*(r[0]-a[0]),a[1]+.4*(r[1]-a[1])],L=Math.hypot(r[0]-a[0],r[1]-a[1]),ux=(r[0]-a[0])/L,uy=(r[1]-a[1])/L,f=.45,
   q=sh==='qq',cx=q?o[0]-uy*f:o[0]+uy*f,cy=q?o[1]+ux*f:o[1]-ux*f,y0=Math.atan2(o[1]-cy,o[0]-cx),
   sw=(q?SW_QQ:SW_PP)[df]*Math.PI;
  return[a,...arcPts(cx,cy,f,y0,sw),b];
 }
 /* p / q: 始点と(始点+5 / +3)の中点を通る、中心を中心とした円弧 */
 const q=sh==='q',r=P((s+(q?3:5)-1)%8+1),o=[(a[0]+r[0])/2,(a[1]+r[1])/2],h=Math.hypot(o[0],o[1]),c=Math.atan2(o[1],o[0]),
  sw=(q?SW_Q:SW_P)[df]*Math.PI;
 return[a,...arcPts(0,0,h,c,sw),b];
}
function mkPath(pts){const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,cum,len:cum[cum.length-1]}}
function at(pa,d){let i=1;while(i<pa.cum.length-1&&pa.cum[i]<d)i++;const a=pa.pts[i-1],b=pa.pts[i],u=clamp((d-pa.cum[i-1])/((pa.cum[i]-pa.cum[i-1])||1),0,1);return[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,Math.atan2(b[1]-a[1],b[0]-a[0])]}
function addSlide(n,str,bpm){
 let i=0,cur=n.l,poly=[],paths=null,wait=0,wInfo=null,beats=0,cb=null,fixed=null,brk=0;
 while(i<str.length&&'-^<>vVpqszw'.includes(str[i])){
  let sh=str[i++];if((sh==='p'||sh==='q')&&str[i]===sh){sh+=sh;i++}
  let via=0;if(sh==='V')via=+str[i++];
  const tg=+str[i++];
  if(sh==='w'){wInfo={a:cur,b:tg};const a=P(cur),b=P(tg),m=[(a[0]+b[0])*.3,(a[1]+b[1])*.3];paths=[wrap(tg-1),tg,wrap(tg+1)].map(k=>mkPath([a,m,P(k)]))}
  else{const pts=seg(sh,cur,tg,via);poly=poly.concat(poly.length?pts.slice(1):pts)}
  cur=tg;
  while(str[i]==='b'||str[i]==='x'){if(str[i]==='b')brk=1;i++}   /* 終点の後ろの b/x を読み飛ばす(これを飛ばさないと [8:1] が読めず長さが4拍になる) */
  const bm=/^\[([^\]]*)\]/.exec(str.slice(i));
  if(bm){
   i+=bm[0].length;const q0=bm[1];
   if(/^[\d.]+##[\d.]+$/.test(q0)){const[w,d]=q0.split('##');wait=+w;fixed=(fixed||0)+ +d}
   else if(q0[0]==='#')fixed=(fixed||0)+ +q0.slice(1);
   else{let q=q0;const h=q.indexOf('#');if(h>0){if(cb===null)cb=+q.slice(0,h);q=q.slice(h+1)}q=q.split('##')[0];const[nn,mm]=q.split(':');if(+nn>0)beats+=4/nn*(+mm||1)}
  }
 }
 if(!paths){if(poly.length<2)return;paths=[mkPath(poly)]}
 const rest=str.slice(i),sb=60/(cb||bpm);
 /* 参考元と同じ: 長さ = 全括弧の拍数の合計 × 60/(指定BPM or 現在BPM)、括弧なしは1拍、待ち = 指定BPMの1拍 */
 n.sl.push({paths,w:wInfo,d:fixed!==null?fixed:(beats||1)*sb,beat:wait||sb,b:(brk||rest.includes('b'))?1:0});
}
function pn(p,t,bpm){
 const pcs=p.split('*'),f=pcs[0],tm=/^([A-E])([1-8])?(.*)$/.exec(f);
 if(tm){const r=tm[3],n={k:'touch',z:tm[1],i:+tm[2]||0,t,d:0,fw:r.includes('f')};if(r.includes('h')){const m=/\[[^\]]*\]/.exec(r);n.d=m?durOf(m[0],bpm):240/bpm/1280}return n}
 const n={k:'tap',l:+f[0],t,d:0,b:0,x:0,sl:[]};let r=f.slice(1),h=0;
 while(r&&'bxf$@?!h'.includes(r[0])){const c=r[0];r=r.slice(1);if(c==='b')n.b=1;if(c==='x')n.x=1;if(c==='h')h=1;if(c==='$')n.st=1;if(c==='@')n.ns=1;if(c==='?'||c==='!')n.hid=1}
 if(h){const m=/^\[[^\]]*\]/.exec(r);n.d=m?durOf(m[0],bpm):240/bpm/1280;if(m)r=r.slice(m[0].length);n.k='hold'}
 if(r)addSlide(n,r,bpm);
 for(let j=1;j<pcs.length;j++)addSlide(n,pcs[j],bpm);
 if(n.k==='tap'&&(n.st||(n.sl.length&&!n.ns)))n.k='star';if(n.hid&&n.sl.length)n.k='hid';if(n.sl.length>1)n.each=1;
 return n;
}
function addTok(tok,t,bpm,out){
 const hs2=[];
 for(const p of tok.split('/')){
  if(/^[1-8]{2,}$/.test(p)){for(const d of p)hs2.push(pn(d,t,bpm))}
  else if(p){const n=pn(p,t,bpm);if(n)hs2.push(n)}
 }
 if(hs2.length>1)hs2.forEach(h=>h.each=1);
 out.push(...hs2);
}
let ev=[],tot=[0,0,0],bl=[[0,120]],bt=[[0,0]];
function parse(src){
 const s=src.replace(/\s+/g,'').replace(/`/g,'');
 let bpm=120,div=4,fx=0,t=0,beat=0,i=0,tok='',out=[];bl=[[0,120]];bt=[[0,0]];
 while(i<s.length){
  const c=s[i];
  if(c==='('){const j=s.indexOf(')',i);bpm=+s.slice(i+1,j)||bpm;bl.push([t,bpm]);i=j+1;continue}
  if(c==='{'){const j=s.indexOf('}',i),v=s.slice(i+1,j);if(v[0]==='#')fx=+v.slice(1);else{div=+v||div;fx=0}i=j+1;continue}
  if(c===','){if(tok)addTok(tok,t,bpm,out);tok='';t+=fx||240/bpm/div;beat+=fx?fx*bpm/60:4/div;bt.push([beat,t]);i++;continue}
  tok+=c;i++;
 }
 if(tok&&tok!=='E')addTok(tok,t,bpm,out);
 out.sort((a,b)=>a.t-b.t);
 notes=out;endT=Math.max(t,...out.map(n=>n.t+n.d+Math.max(0,...(n.sl||[]).map(x=>x.beat+x.d))));
 now=-2;
}
/* 時間(秒)⇔拍 変換(BPM変化対応) */
function bpmAt(t){let b=bl[0][1];for(const q of bl)if(q[0]<=t)b=q[1];return b}
function t2b(t){
 if(t<=0)return t*bpmAt(0)/60;
 for(let i=1;i<bt.length;i++)if(t<=bt[i][1]){const a=bt[i-1],b=bt[i];return a[0]+(b[0]-a[0])*(t-a[1])/((b[1]-a[1])||1)}
 const l=bt[bt.length-1];return l[0]+(t-l[1])*bpmAt(t)/60;
}
function b2t(b){
 if(b<=0)return b*60/bpmAt(0);
 for(let i=1;i<bt.length;i++)if(b<=bt[i][0]){const a=bt[i-1],c=bt[i];return a[1]+(c[1]-a[1])*(b-a[0])/((c[0]-a[0])||1)}
 const l=bt[bt.length-1];return l[1]+(b-l[0])*60/bpmAt(endT);
}

/* ================= アニメーション(描画)システム ================= */
function resize(){
 WW=innerWidth;HH=innerHeight;S=Math.floor(Math.max(280,Math.min(WW,HH,1000)));const d=Math.min(devicePixelRatio||1,2);
 cv.width=WW*d;cv.height=HH*d;cv.style.width=WW+'px';cv.style.height=HH+'px';g.setTransform(d,0,0,d,0,0);
 OX=Math.floor((WW-S)/2);OY=Math.floor((HH-S)/2);cx=cy=S/2;R=S*.45;   /* 描画は全画面キャンバス上で、譜面だけ中央の正方形に translate */
}
const BG='#1a1a2e',U=()=>R/300;
const laneXY=(l,r)=>[cx+Math.cos(ang(l))*r,cy+Math.sin(ang(l))*r];
const ZR={A:.9,B:.465,C:0,D:.9,E:.66};
function tpos(n){
 if(n.z==='C')return[cx,cy];
 const a=(n.z==='D'||n.z==='E')?-Math.PI/2+(n.i-1)*Math.PI/4:ang(n.i),r=R*ZR[n.z];
 return[cx+Math.cos(a)*r,cy+Math.sin(a)*r];
}
/* ノーツ位置: 半分の時間は中心近くで拡大、残り半分で判定線へ移動 */
function nPos(tn,hold){
 const half=A/2,d=tn-now;
 if(d>A)return{r:.25,s:0,d};
 let r,s=1;
 if(d>half){r=.25;s=1-(d-half)/half}
 else if(d>=0){r=.25+.75*(1-d/half)}
 else r=hold?1:.25+.75*(1+(-d/half));
 return{r,s,d};
}
function dot(x,y,r,c){g.beginPath();g.arc(x,y,r,0,TAU);g.fillStyle=c;g.fill()}
function trail(l,r,c){
 if(r<R*.06)return;
 const a=ang(l),w=Math.PI/8,sg=w/4;
 g.save();g.strokeStyle=c;g.lineWidth=2*U();
 g.globalAlpha=.4;g.beginPath();g.arc(cx,cy,r,a-w,a+w);g.stroke();
 for(let i=1;i<=4;i++){
  g.globalAlpha=.4*(1-i/5);
  g.beginPath();g.arc(cx,cy,r,a-w-i*sg,a-w-(i-1)*sg);g.stroke();
  g.beginPath();g.arc(cx,cy,r,a+w+(i-1)*sg,a+w+i*sg);g.stroke();
 }
 g.restore();
}
function eachArc(l1,l2,r){
 let dd=((l2-l1)%8+8)%8;if(dd>4){const t=l1;l1=l2;l2=t;dd=8-dd}
 g.save();g.globalAlpha=.7;g.strokeStyle='#FFD700';g.lineWidth=2*U();g.beginPath();
 if(dd===4)g.arc(cx,cy,r,0,TAU);else g.arc(cx,cy,r,ang(l1),ang(l1)+dd*Math.PI/4);
 g.stroke();g.restore();
}
function haloFill(c,pathFn,holeFn){g.beginPath();pathFn();holeFn();g.fillStyle=c;g.fill()}
function tapShape(x,y,sc,c,brk,ex){
 const o=R/12.5*sc*1.36,i=.65*o;
 if(ex){const h=exHi?1.19*1.2:1.19;g.beginPath();g.arc(x,y,o*h,0,TAU,false);g.arc(x,y,o,0,TAU,true);g.closePath();g.fillStyle=brk?'rgba(255,200,120,.8)':c===COL.each?'rgba(255,245,150,.8)':'rgba(255,180,210,.8)';g.fill()}
 g.beginPath();g.arc(x,y,o,0,TAU,false);g.arc(x,y,i,0,TAU,true);g.closePath();
 if(brk){const gr=g.createRadialGradient(x,y,i,x,y,o);gr.addColorStop(0,'#FFB347');gr.addColorStop(.5,'#FF8C00');gr.addColorStop(1,'#FF6600');g.fillStyle=gr}else g.fillStyle=c;
 g.fill();
 g.strokeStyle='#fff';g.lineWidth=2*U();
 g.beginPath();g.arc(x,y,o,0,TAU);g.stroke();g.beginPath();g.arc(x,y,i,0,TAU);g.stroke();
 dot(x,y,.15*o,brk?COL.brk:c);

function evalSlides(t,s17){

}

  let lab=(hd[hi]&&hd[hi][0]&&hd[hi][0].categoryName)||('H'+hi);while(used.has(lab))lab+='+';used.add(lab);
  judgeLM(lm,mode).forEach((q,pi)=>{

   if(!p){p={x,y,px:x,py:y,lane:laneOf(x,y),hist:[],mv:false};ptrs.set(key,p)}

  step='① カメラの許可';say('① カメラの許可を待っています…（許可ダイアログが出ていれば「許可」）');
  if(!vCam.srcObject){
   const stm=await withTO(navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480},frameRate:{ideal:60}}}),30000,step);
   vCam.srcObject=stm;
  }
  step='② 映像の再生';say('② 映像を再生中…');
  await withTO(vCam.play(),8000,step);
  const V='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/';
  step='③ 手認識ライブラリの読み込み';say('③ 手認識ライブラリを読み込み中…');
  const mp=await withTO(import(V+'vision_bundle.mjs'),20000,step);
  step='④ wasm の読み込み';say('④ wasm を読み込み中…');
  const fs=await withTO(mp.FilesetResolver.forVisionTasks(V+'wasm'),20000,step);
  step='⑤ 手認識モデルの読み込み(GPU)';say('⑤ モデルを読み込み中…（初回は数秒〜十数秒）');
  hl=await withTO(mp.HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:.5,minHandPresenceConfidence:.5,minTrackingConfidence:.5}),40000,step);
  camOK=true;say('手認識: 準備OK');camNext();
 }catch(e){
  cs.style.color='#ff8a8a';cs.textContent='失敗（'+step+'）: '+(e.message||e)+'  ※キーボードの1〜8のみ使えます';
  cb.style.display='block';
 }
 camBusy=false;
}
$('cb').onclick=()=>initCam();
function drawHands(){
 const nt=performance.now();
 if(showSk&&nt-handVisT<250){g.save();g.strokeStyle='rgba(255,255,255,.45)';g.lineWidth=1.5;g.beginPath();for(const h of handVis)for(const[a,b]of BONES){g.moveTo(h[a][0],h[a][1]);g.lineTo(h[b][0],h[b][1])}g.stroke();g.restore()}
 for(const p of ptrs.values()){g.save();g.fillStyle=p.mv?'#ffd84a':'rgba(255,216,74,.35)';g.strokeStyle='#000';g.lineWidth=1.5;g.beginPath();g.arc(p.x,p.y,7*U(),0,TAU);g.fill();g.stroke();g.restore()}
}
function drawDbg(){
 g.save();g.font=`${S*.022}px ui-monospace,monospace`;g.textAlign='center';g.textBaseline='bottom';g.fillStyle='rgba(255,255,255,.6)';
 g.fillText(`描画 ${rfps.toFixed(0)}fps / 検出 ${detFps.toFixed(0)}fps ${detMs.toFixed(0)}ms`,cx,S-S*.004);g.restore();
}
$('pt').onchange=e=>{store.set('c_pt',e.target.value);ptrs.clear()};
$('mv').oninput=e=>{mvThr=+e.target.value/100;$('mvv').textContent=e.target.value;store.set('c_mv',e.target.value)};
$('dm').oninput=e=>{dimA=+e.target.value/100;$('dmv').textContent=e.target.value;store.set('c_dm',e.target.value)};
$('skl').onchange=e=>{showSk=e.target.checked;store.set('c_sk',e.target.checked?'1':'0')};
$('go').onclick=()=>{if(!$('go').disabled&&SONG&&notes.length)startRun()};
$('hs').oninput=e=>{$('hsv').textContent=(+e.target.value).toFixed(2);store.set('p_hs',e.target.value);setHS(+e.target.value)};
/* ---- 出力デバイス別の補正(有線 / Bluetooth) ---- */
let prof='';
function showProf(reload){
 const p=OutProfile.effective(ctx),ch=p!==prof;prof=p;
 if(reload||ch){   /* プロファイルが変わったら、そのプロファイルの保存値に切り替える */
  $('au').value=OutProfile.getAu(p,ctx);$('auv').textContent=$('au').value;
 }
 $('od').textContent=OutProfile.label(p,ctx);
}
$('om').onchange=e=>{OutProfile.setMode(e.target.value);showProf(true)};
$('of').oninput=e=>{$('ofv').textContent=e.target.value;store.set('c_of',e.target.value)};   /* カメラ版は有線/BTとは別に保存 */
$('au').oninput=e=>{$('auv').textContent=e.target.value;OutProfile.setAu(prof,e.target.value)};
/* 画面を最初にタッチした時点で音声を起こし、出力遅延を測り直す(未再生だと0を返すブラウザがあるため) */
$('ready').addEventListener('pointerdown',()=>{if(ctx&&ctx.state==='suspended')ctx.resume().then(()=>setTimeout(()=>showProf(false),300)).catch(()=>{})},{passive:true});
if(navigator.mediaDevices&&navigator.mediaDevices.addEventListener)navigator.mediaDevices.addEventListener('devicechange',()=>setTimeout(()=>{if(state!=='play')showProf(false)},600));
$('snd').onchange=e=>store.set('p_snd',e.target.checked?'1':'0');
$('fl').onchange=e=>store.set('p_fl',e.target.checked?'1':'0');
$('pbtn').addEventListener('pointerdown',e=>{e.preventDefault();pauseGame()});
$('pr').onclick=resumeGame;
$('pt').onclick=()=>startRun();
$('xre').onclick=()=>startRun();
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
addEventListener('resize',resize);
resize();requestAnimationFrame(frame);boot();
</script></body></html>
