<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>maimai Player</title>
<style>
:root{--bg:#eef0fa;--fg:#23264a;--card:#fff;--ac:#ff4fa3;--mut:#8087b0}
@media (prefers-color-scheme:dark){:root{--bg:#0a0b18;--fg:#dfe2ff;--card:#171a35}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1{font-size:20px;margin:0;padding:16px}
#wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:0 16px 24px;max-width:900px;margin:0 auto}
@media(min-width:720px){#wrap{grid-template-columns:260px 1fr;align-items:start}}
#list{display:flex;flex-direction:column;gap:8px}
.song{display:flex;gap:10px;align-items:center;background:var(--card);border:2px solid transparent;border-radius:12px;padding:8px;cursor:pointer;color:inherit;text-align:left;font:inherit;width:100%}
.song.sel{border-color:var(--ac)}
.jk{width:56px;height:56px;border-radius:8px;background:linear-gradient(135deg,#ff4fa3,#4f7bff);object-fit:cover;flex:none}
.song b{display:block;font-size:15px}.song small{color:var(--mut)}
#detail{background:var(--card);border-radius:14px;padding:16px;min-height:200px}
#detail .big{width:100%;max-width:240px;aspect-ratio:1;border-radius:12px;object-fit:cover;background:linear-gradient(135deg,#ff4fa3,#4f7bff);display:block;margin-bottom:12px}
#detail h2{margin:0 0 2px;font-size:20px}
.diffs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.diffs button{border:2px solid var(--c);background:transparent;color:var(--fg);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer;min-width:84px}
.diffs button.sel{background:var(--c);color:#fff}
.diffs small{display:block;font-size:11px;opacity:.8}
.act{display:flex;gap:10px}
.act a{flex:1;text-align:center;padding:12px;border-radius:10px;text-decoration:none;font-weight:bold;background:var(--ac);color:#fff}
.act a.alt{background:#4f7bff}
.act a.off{opacity:.4;pointer-events:none}
#err{color:#d33;padding:0 16px}
</style></head><body>
<h1>maimai Player <a href="editor.html" style="font-size:12px;color:var(--ac);font-weight:normal">譜面データ作成</a></h1>
<div id="err"></div>
<div id="wrap"><div id="list"></div><div id="detail">曲を選んでください</div></div>
<script>
const DN={1:'EASY',2:'BASIC',3:'ADVANCED',4:'EXPERT',5:'MASTER',6:'Re:MASTER',7:'UTAGE'};
const SLOTS=['4','5','6'];
const DC={1:'#3bb54a',2:'#3bb54a',3:'#f0a020',4:'#e03a4a',5:'#9b3fd0',6:'#c9a6f0',7:'#ff4fa3'};
const $=id=>document.getElementById(id);
function meta(tx){
 const o={diffs:[]};
 for(const m of tx.matchAll(/^&(\w+)=(.*)$/gm)){
  const k=m[1],v=m[2].trim();
  if(k==='title')o.title=v;else if(k==='artist')o.artist=v;
  else if(k==='wholebpm')o.bpm=v;
 }
 for(const m of tx.matchAll(/^&inote_(\d)=/gm)){
  const n=m[1],lv=(tx.match(new RegExp('^&lv_'+n+'=(.*)$','m'))||[])[1],ds=(tx.match(new RegExp('^&des_'+n+'=(.*)$','m'))||[])[1];
  o.diffs.push({n,lv:(lv||'').trim(),des:(ds||'').trim()});
 }
 return o;
}
let songs=[],cur=null,curDiff=null;
async function main(){
 try{
  const ids=await (await fetch('songs/index.json')).json();
  for(const id of ids){
   try{
    const base='songs/'+encodeURIComponent(id)+'/';
    const tx=await (await fetch(base+'maidata.txt')).text();
    let cfg={};for(const f of['song.json','songs.json']){try{const r=await fetch(base+f);if(r.ok){cfg=await r.json();break}}catch(e){}}
    const m=meta(tx);
    songs.push({id,base,cfg,title:m.title||id,artist:m.artist||'',bpm:m.bpm,diffs:m.diffs,
     jackets:[...new Set([cfg.jacket,'jacket.jpg','jacket.jpeg','jacket.png','bg.png','bg.jpg'].filter(Boolean))].map(x=>base+x)});
   }catch(e){console.warn(id,e)}
  }
  render();
  if(songs.length)select(0);
 }catch(e){$('err').textContent='songs/index.json を読み込めません。サーバー経由で開いてください。('+e.message+')'}
}
function jk(s,cls){const i=document.createElement('img');i.className=cls;const c=s.jackets.slice(),nx=()=>{if(c.length)i.src=c.shift();else i.removeAttribute('src')};i.onerror=nx;nx();return i}
function render(){
 const l=$('list');l.textContent='';
 songs.forEach((s,i)=>{
  const b=document.createElement('button');b.className='song';b.dataset.i=i;
  b.append(jk(s,'jk'));
  const d=document.createElement('div');
  const t=document.createElement('b');t.textContent=s.title;
  const a=document.createElement('small');a.textContent=s.artist;
  d.append(t,a);b.append(d);b.onclick=()=>select(i);l.append(b);
 });
}
function select(i){
 cur=songs[i];
 document.querySelectorAll('.song').forEach(e=>e.classList.toggle('sel',+e.dataset.i===i));
 const last=cur.diffs[cur.diffs.length-1];
 curDiff=last?last.n:null;
 detail();
}
function detail(){
 const s=cur,d=$('detail');d.textContent='';
 d.append(jk(s,'big'));
 const h=document.createElement('h2');h.textContent=s.title;
 const p=document.createElement('div');p.style.color='var(--mut)';
 p.textContent=s.artist+(s.bpm?'  /  BPM '+s.bpm:'');
 d.append(h,p);
 const ds=document.createElement('div');ds.className='diffs';
 [...new Set([...SLOTS,...s.diffs.map(y=>y.n)])].sort().forEach(n=>{
  const x=s.diffs.find(y=>y.n===n)||{n,missing:1,lv:''};
  const b=document.createElement('button');b.style.setProperty('--c',DC[x.n]||'#888');
  b.className=x.n===curDiff?'sel':'';
  b.innerHTML='<b></b><small></small>';
  b.firstChild.textContent=DN[x.n]||('Lv'+x.n);
  b.lastChild.textContent=x.lv?'Lv '+x.lv:'';
  if(x.missing){b.disabled=true;b.style.opacity='.3';b.style.cursor='default';b.lastChild.textContent='なし'}else b.onclick=()=>{curDiff=x.n;detail()};
  ds.append(b);
 });
 d.append(ds);
 const q='?song='+encodeURIComponent(s.id)+(curDiff?'&diff='+curDiff:'');
 const act=document.createElement('div');act.className='act';
 const v=document.createElement('a');v.className='alt'+(curDiff?'':' off');v.href='viewer.html'+q;v.textContent='譜面を見る';
 const pl=document.createElement('a');pl.href='play.html'+q;pl.textContent='プレイ';
 const cm=document.createElement('a');cm.className='alt';cm.href='playcam.html'+q;cm.textContent='カメラ';
 act.append(v,pl,cm);d.append(act);
}
main();
</script></body></html>
